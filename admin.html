<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    body{font-family:Consolas,monospace;background:#111;color:#0f0;display:grid;place-items:center;height:100vh;margin:0}
    .box{width:min(420px,90vw);border:1px solid #0f0;padding:24px}
    input,button{width:100%;box-sizing:border-box;margin-top:10px;padding:12px;background:#000;color:#0f0;border:1px solid #0f0}
    button{cursor:pointer;font-weight:bold}
    #result{margin-top:18px;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="box">
    <h2>SECRET ADMIN LOGIN</h2>
    <input id="username" placeholder="username">
    <input id="password" type="password" placeholder="password">
    <button onclick="login()">LOGIN</button>
    <div id="result"></div>
  </div>

  <script>
    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const body = new URLSearchParams({ username, password });

      try {
        const res = await fetch("http://127.0.0.1:5000/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body
        });

        const data = await res.json();
        document.getElementById("result").textContent =
          data.success
            ? "ACCESS GRANTED\n\n🍕 SECRET FOOD ADMIN PANEL\n🎮 SECRET GAME ADMIN PANEL"
            : "ACCESS DENIED";
      } catch (e) {
        document.getElementById("result").textContent =
          "Backend is not running. Start server.py first.";
      }
    }
  </script>
</body>
</html>
